services:
  postgres:
    image: postgres:17
    container_name: weatherops_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    image: weatherops:1.0
    environment: &weather-database
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build: .
    image: weatherops:1.0
    command: ["airflow", "standalone"]
    environment:
      <<: *weather-database
    ports:
      - "8080:8080"
    volumes:
      - airflow_data:/opt/airflow
      - weather_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_data:
  weather_data:
